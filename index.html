<!doctype html>
<html lang="en" data-theme="sunrise">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7EE" />
    <meta name="description" content="SolRise: rise a little every day. Daily routines, goals and family tasks, with a little celebration for every win." />
    <title>SolRise</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('solrise_theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
